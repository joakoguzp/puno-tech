name: Audit ESLint

on:
  push:
    branches:
      - refine/puno-tech-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-eslint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint independently
        run: npm run lint
